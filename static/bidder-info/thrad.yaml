# Thrad. The adapter speaks bid request protocol v1 and v2, chosen per
# placement (Stored Imp "protocol": 2 → v2; unset → v1 for now) — see
# adapters/thrad/thrad.go. This endpoint is v2's
# (docs.thrad.ai/api/api-reference/bid-request-v2); v1's endpoint is fixed in
# code until Thrad retires it on 2026-11-04. Per-publisher keys come from
# pbs.yaml adapters.thrad.extra_info (same keys for both protocols).
endpoint: "https://ssp.thrad.ai/api/v2/bid-request"
maintainer:
  email: "prebid@tpcsrv.com"
capabilities:
  site:
    mediaTypes:
      - native
  app:
    mediaTypes:
      - native
